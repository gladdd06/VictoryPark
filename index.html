<script>
(function () {
  var points = [
    {id:'monument', x:600, y:450, zoom:2.6, title:'Памятник Эльбрусу', short:'Двуглавый Эльбрус из железа в центре парка.'},
    {id:'green', x:800, y:372, zoom:2.5, title:'Зелёные насаждения', short:'Берёзы, хвойные деревья и ягодные кустарники.'},
    {id:'play', x:400, y:540, zoom:2.6, title:'Детская площадка', short:'Брёвна, валуны и балансиры.'},
    {id:'rest', x:392, y:388, zoom:2.6, title:'Скамейки', short:'Поляна отдыха в тени деревьев.'},
    {id:'sport', x:800, y:544, zoom:2.6, title:'Спортплощадка', short:'Турники и брусья под открытым небом.'},
    {id:'s1', x:330, y:660, zoom:2.8, title:'Нарзан № 1', short:'Питьевой источник у подножия гор.'},
    {id:'s2', x:600, y:676, zoom:2.8, title:'Нарзан № 2', short:'Питьевой источник у подножия гор.'},
    {id:'s3', x:870, y:660, zoom:2.8, title:'Нарзан № 3', short:'Питьевой источник у подножия гор.'}
  ];
  var sel = null;
  var layer = document.getElementById('pp-layer');
  var back = document.getElementById('pp-back');
  var legend = document.getElementById('pp-legend');
  var current = document.getElementById('pp-current');
  var pins = Array.prototype.slice.call(document.querySelectorAll('[data-pin]'));
  function find(id) { for (var i = 0; i < points.length; i++) if (points[i].id === id) return i; return -1; }
  function render() {
    var idx = find(sel), cur = idx >= 0 ? points[idx] : null;
    var s = cur ? cur.zoom : 1, tx = 0, ty = 0;
    if (cur) {
      var cx = cur.x / 1200 * 100, cy = cur.y / 760 * 100;
      tx = Math.min(0, Math.max(100 - 100 * s, 50 - cx * s));
      ty = Math.min(0, Math.max(100 - 100 * s, 50 - cy * s));
    }
    var k = cur ? 1 : Math.min(1, Math.max(0.55, layer.clientWidth / 640));
    layer.style.transform = 'translate(' + tx.toFixed(3) + '%, ' + ty.toFixed(3) + '%) scale(' + s + ')';
    pins.forEach(function (b) {
      b.style.transform = 'translate(-50%, -50%) scale(' + (k / s).toFixed(4) + ')';
      b.style.backgroundColor = b.getAttribute('data-pin') === sel ? '#B5471B' : b.getAttribute('data-base');
    });
    back.style.display = cur ? 'flex' : 'none';
    legend.style.display = cur ? 'none' : 'flex';
    current.style.display = cur ? 'flex' : 'none';
    if (cur) {
      document.getElementById('pp-title').textContent = cur.title;
      document.getElementById('pp-short').textContent = cur.short;
      document.getElementById('pp-next-label').textContent = 'Дальше: ' + points[(idx + 1) % points.length].title;
    }
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-pin],[data-pin-go],#pp-back,#pp-next');
    if (!t) return;
    if (t.id === 'pp-back') sel = null;
    else if (t.id === 'pp-next') sel = points[(find(sel) + 1) % points.length].id;
    else sel = t.getAttribute('data-pin') || t.getAttribute('data-pin-go');
    render();
  });
  window.addEventListener('resize', render);
  render();
})();
</script>
